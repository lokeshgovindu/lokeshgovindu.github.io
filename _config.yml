title: Productivity Tools, Tips & Tricks
author: Lokesh Govindu
email: lokeshgovindu@gmail.com
description: Curated productivity tips, shortcuts, and workflows for developers — Visual Studio, CMD Prompt, Windows, and more.
url: "https://lokeshgovindu.github.io"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Plugins (bundled with the github-pages gem)
plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Every page uses the shared layout by default
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
    values:
      layout: post
      permalink: /blog/:title/
      nav: blog
