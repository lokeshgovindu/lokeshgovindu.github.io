    <div class="container">
        <p class="mb-0">&copy; {{ 'now' | date: "%Y" }} <a href="{{ '/' | relative_url }}">Lokesh Govindu</a> &mdash; Productivity Tools, Tips &amp; Tricks</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="{{ '/search-data.js' | relative_url }}"></script>
<script>
(function () {
    if (typeof Fuse === 'undefined' || typeof SITE_SEARCH_DATA === 'undefined') return;

    var input = document.getElementById('navSearchInput');
    var form = document.getElementById('navSearchForm');
    var clearBtn = document.getElementById('navSearchClear');
    var dropdown = document.getElementById('navSearchDropdown');
    if (!input || !dropdown) return;

    var fuse = new Fuse(SITE_SEARCH_DATA, {
        keys: [
            { name: 'title', weight: 0.45 },
            { name: 'tags', weight: 0.35 },
            { name: 'content', weight: 0.15 },
            { name: 'section', weight: 0.05 }
        ],
        threshold: 0.35,
        minMatchCharLength: 2
    });

    var sectionIconClass = {
        'Visual Studio': 'fa fa-code',
        'CMD Prompt': 'fa fa-terminal',
        'Windows': 'fab fa-windows',
        'My Work': 'fa fa-diagram-project',
        'Blog': 'fa fa-pen-nib',
        'About Me': 'fa fa-user'
    };

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    var resultEls = [];
    var activeIndex = -1;

    function setActive(index) {
        resultEls.forEach(function (el) { el.classList.remove('active'); });
        if (index < 0 || index >= resultEls.length) {
            activeIndex = -1;
            return;
        }
        activeIndex = index;
        var el = resultEls[activeIndex];
        el.classList.add('active');
        el.scrollIntoView({ block: 'nearest' });
    }

    function render(query) {
        var results = fuse.search(query).slice(0, 6).map(function (r) { return r.item; });

        if (results.length === 0) {
            dropdown.innerHTML = '<div class="nav-search-empty">No results for &ldquo;' + escapeHtml(query) + '&rdquo;</div>';
            dropdown.classList.add('show');
            resultEls = [];
            activeIndex = -1;
            return;
        }

        var html = results.map(function (item) {
            var icon = sectionIconClass[item.section] || 'fa fa-file';
            return (
                '<a href="' + item.url + '" class="nav-search-result">' +
                '<span class="nav-search-result-icon"><i class="' + icon + '"></i></span>' +
                '<span style="min-width:0; flex:1;">' +
                '<span class="nav-search-result-title d-block">' + escapeHtml(item.title) + '</span>' +
                '<span class="nav-search-result-section">' + escapeHtml(item.section) + '</span>' +
                '</span>' +
                '</a>'
            );
        }).join('');

        html += '<a href="/search/?q=' + encodeURIComponent(query) + '" class="nav-search-seeall">See all results</a>';

        dropdown.innerHTML = html;
        dropdown.classList.add('show');
        resultEls = Array.prototype.slice.call(dropdown.querySelectorAll('.nav-search-result, .nav-search-seeall'));
        activeIndex = -1;
    }

    input.addEventListener('input', function () {
        var q = input.value.trim();
        clearBtn.classList.toggle('d-none', q.length === 0);
        if (q.length < 2) {
            dropdown.classList.remove('show');
            return;
        }
        render(q);
    });

    input.addEventListener('focus', function () {
        if (input.value.trim().length >= 2) dropdown.classList.add('show');
    });

    input.addEventListener('keydown', function (e) {
        if (!dropdown.classList.contains('show') || resultEls.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            setActive(activeIndex + 1 >= resultEls.length ? resultEls.length - 1 : activeIndex + 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setActive(activeIndex - 1 < 0 ? 0 : activeIndex - 1);
        } else if (e.key === 'Enter' && activeIndex >= 0 && resultEls[activeIndex]) {
            e.preventDefault();
            window.location.href = resultEls[activeIndex].getAttribute('href');
        }
    });

    clearBtn.addEventListener('click', function () {
        input.value = '';
        clearBtn.classList.add('d-none');
        dropdown.classList.remove('show');
        input.focus();
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var q = input.value.trim();
        if (q) window.location.href = '/search/?q=' + encodeURIComponent(q);
    });

    document.addEventListener('click', function (e) {
        if (!form.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.remove('show');
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') dropdown.classList.remove('show');
    });
})();
</script>
<script>
(function () {
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    var icon = toggle.querySelector('i');

    function applyIcon(theme) {
        icon.className = theme === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        toggle.setAttribute('aria-pressed', theme === 'dark');
        toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }

    applyIcon(document.documentElement.getAttribute('data-theme') || 'light');

    function syncGiscusTheme(theme) {
        var iframe = document.querySelector('iframe.giscus-frame');
        if (!iframe) return;
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
    }

    toggle.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        applyIcon(next);
        syncGiscusTheme(next);
    });
})();
</script>
