{%- assign page_title = page.title | default: site.title -%}
{%- if page.title and page.url != "/" -%}
  {%- assign page_title = page.title | append: " | Dev Tips & Tricks" -%}
{%- else -%}
  {%- assign page_title = "Dev Tips & Tricks | Lokesh Govindu" -%}
{%- endif -%}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="icon" type="image/jpeg" href="{{ '/resources/LoGoAvatar.jpg' | relative_url }}">
</head>
