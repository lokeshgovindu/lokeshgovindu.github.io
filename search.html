---
title: Search
nav: search
ph_label: Find Anything
heading: Search
ph_sub: Search across all tips, extensions, tools, shortcuts, and commands on this site.
---

<!-- ───── SEARCH ───── -->
<section class="tips-section">
    <div class="container">

        <!-- Search Box -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-8">
                <div class="search-box">
                    <i class="fa fa-magnifying-glass search-box-icon"></i>
                    <input type="text" id="searchInput" class="search-input"
                           placeholder="Try 'git blame', 'FancyZones', 'breakpoint', 'ffmpeg'…" autofocus
                           autocomplete="off" spellcheck="false">
                    <button id="searchClear" class="search-clear d-none" title="Clear"><i class="fa fa-xmark"></i></button>
                </div>
                <!-- Filter buttons -->
                <div class="d-flex gap-2 mt-3 flex-wrap" id="filterBtns">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="Visual Studio">Visual Studio</button>
                    <button class="filter-btn" data-filter="CMD Prompt">CMD Prompt</button>
                    <button class="filter-btn" data-filter="Windows">Windows</button>
                    <button class="filter-btn" data-filter="My Work">My Work</button>
                    <button class="filter-btn" data-filter="Blog">Blog</button>
                    <button class="filter-btn" data-filter="About Me">About Me</button>
                </div>
            </div>
        </div>

        <!-- Result count -->
        <div id="searchStats" class="text-center mb-3 d-none"
             style="font-size:0.85rem;color:var(--muted-text)"></div>

        <!-- Search results -->
        <div id="searchResults" class="row justify-content-center">
            <div class="col-lg-8" id="searchResultsInner"></div>
        </div>

        <!-- Initial / empty state — 3 category browse cards -->
        <div id="searchInitial" class="row g-4 justify-content-center mt-2"></div>

    </div>
</section>

{% raw %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const input       = document.getElementById('searchInput');
    const clearBtn    = document.getElementById('searchClear');
    const resultsWrap = document.getElementById('searchResultsInner');
    const statsEl     = document.getElementById('searchStats');
    const initialEl   = document.getElementById('searchInitial');
    const filterBtns  = document.querySelectorAll('.filter-btn');

    let activeFilter  = 'all';

    /* ── Hide results wrapper initially (may be shown below if ?q= is set) ── */
    document.getElementById('searchResults').classList.add('d-none');

    /* ── Fuse.js config ── */
    const fuse = new Fuse(SITE_SEARCH_DATA, {
        keys: [
            { name: 'title',   weight: 0.45 },
            { name: 'tags',    weight: 0.35 },
            { name: 'content', weight: 0.15 },
            { name: 'section', weight: 0.05 }
        ],
        threshold: 0.35,
        minMatchCharLength: 2,
        includeScore: true
    });

    /* ── Badge colours ── */
    const sectionBadge = {
        'Visual Studio': 'text-bg-primary',
        'CMD Prompt':    'text-bg-warning',
        'Windows':       'text-bg-info',
        'My Work':       'text-bg-dark',
        'Blog':          'text-bg-primary',
        'About Me':      'text-bg-success'
    };
    const categoryBadge = {
        'Extension':     'text-bg-primary',
        'Tool':          'text-bg-success',
        'Shortcut':      'text-bg-secondary',
        'Command':       'text-bg-secondary',
        'Tip':           'text-bg-info',
        'Best Practice': 'text-bg-dark',
        'Project':       'text-bg-dark',
        'Post':          'text-bg-primary',
        'Contact':       'text-bg-success'
    };

    /* ── Section icons ── */
    const sectionIcon = {
        'Visual Studio': '<div class="tip-icon vs" style="width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.9rem"><i class="fa fa-code"></i></div>',
        'CMD Prompt':    '<div class="tip-icon cmd" style="width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.9rem"><i class="fa fa-terminal"></i></div>',
        'Windows':       '<div class="tip-icon gen" style="width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.9rem"><i class="fab fa-windows"></i></div>',
        'My Work':       '<div class="tip-icon" style="width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.9rem;background:#dbeafe;color:#1d4ed8"><i class="fa fa-diagram-project"></i></div>',
        'Blog':          '<div class="tip-icon" style="width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.9rem;background:#ede9fe;color:#7c3aed"><i class="fa fa-pen-nib"></i></div>',
        'About Me':      '<div class="tip-icon" style="width:38px;height:38px;min-width:38px;border-radius:10px;font-size:0.9rem;background:#dcfce7;color:#16a34a"><i class="fa fa-user"></i></div>'
    };

    /* ── Highlight query terms in text ── */
    function highlight(text, query) {
        if (!query || query.length < 2) return text;
        const terms = query.trim().split(/\s+/).filter(t => t.length > 1);
        let out = text;
        terms.forEach(term => {
            const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            out = out.replace(re, '<mark>$1</mark>');
        });
        return out;
    }

    /* ── Render a list of items ── */
    function renderResults(items, query) {
        if (items.length === 0) {
            resultsWrap.innerHTML =
                '<div class="text-center py-5">' +
                '<i class="fa fa-magnifying-glass" style="font-size:3rem;color:var(--border)"></i>' +
                '<p class="mt-3 mb-1" style="color:var(--dark-text);font-weight:600">No results found</p>' +
                '<p style="color:var(--muted-text);font-size:0.875rem">Try different keywords, or ' +
                '<button class="filter-btn active d-inline-block" style="padding:3px 10px" onclick="resetFilter()">clear the filter</button></p>' +
                '</div>';
            return;
        }

        resultsWrap.innerHTML = items.map(item => {
            const tags = item.tags.slice(0, 4)
                .map(t => '<span class="search-result-tag">' + t + '</span>')
                .join('');
            return (
                '<a href="' + item.url + '" class="search-result-card">' +
                '<div class="d-flex align-items-start gap-3">' +
                (sectionIcon[item.section] || '') +
                '<div style="flex:1;min-width:0">' +
                '<div class="d-flex align-items-center gap-2 mb-1 flex-wrap">' +
                '<span class="search-result-title">' + highlight(item.title, query) + '</span>' +
                '<span class="badge ' + (sectionBadge[item.section] || 'text-bg-secondary') + '" style="font-size:0.7rem">' + item.section + '</span>' +
                '<span class="badge ' + (categoryBadge[item.category] || 'text-bg-secondary') + '" style="font-size:0.7rem">' + item.category + '</span>' +
                '</div>' +
                '<p class="search-result-content">' + highlight(item.content, query) + '</p>' +
                '<div class="d-flex gap-1 flex-wrap">' + tags + '</div>' +
                '</div>' +
                '<i class="fa fa-arrow-right mt-1" style="color:var(--border);flex-shrink:0;font-size:0.8rem"></i>' +
                '</div>' +
                '</a>'
            );
        }).join('');
    }

    /* ── Main search function ── */
    function doSearch() {
        const query = input.value.trim();
        clearBtn.classList.toggle('d-none', query.length === 0);

        if (query.length === 0) {
            resultsWrap.innerHTML = '';
            statsEl.classList.add('d-none');
            document.getElementById('searchResults').classList.add('d-none');
            initialEl.classList.remove('d-none');
            return;
        }

        initialEl.classList.add('d-none');
        document.getElementById('searchResults').classList.remove('d-none');

        let results = fuse.search(query).map(r => r.item);
        if (activeFilter !== 'all') {
            results = results.filter(r => r.section === activeFilter);
        }

        const total = results.length;
        statsEl.textContent = total + ' result' + (total !== 1 ? 's' : '') + ' for "' + query + '"'
            + (activeFilter !== 'all' ? ' in ' + activeFilter : '');
        statsEl.classList.remove('d-none');

        renderResults(results, query);
    }

    /* ── Filter reset (called from no-results inline button) ── */
    window.resetFilter = function () {
        filterBtns.forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        activeFilter = 'all';
        doSearch();
    };

    /* ── Events ── */
    input.addEventListener('input', doSearch);

    clearBtn.addEventListener('click', function () {
        input.value = '';
        doSearch();
        input.focus();
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', function () {
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            activeFilter = this.dataset.filter;
            doSearch();
        });
    });

    /* ── Pre-fill from URL ?q= param ── */
    const urlQ = new URLSearchParams(window.location.search).get('q');
    if (urlQ) {
        input.value = urlQ;
        doSearch();
    }

    /* ── Render initial browse cards ── */
    const categories = [
        {
            name: 'Visual Studio', url: '/visual-studio/',
            icon: 'fa fa-code', cls: 'vs',
            desc: 'Extensions, shortcuts &amp; editor tips'
        },
        {
            name: 'CMD Prompt', url: '/cmd-prompt/',
            icon: 'fa fa-terminal', cls: 'cmd',
            desc: 'Commands, Cmder, Clink &amp; Oh My Posh'
        },
        {
            name: 'Windows', url: '/windows/',
            icon: 'fab fa-windows', cls: 'gen',
            desc: 'Tools, apps &amp; Windows tips'
        },
        {
            name: 'My Work', url: '/my-work/',
            icon: 'fa fa-diagram-project', style: 'background:#dbeafe;color:#1d4ed8',
            desc: 'Open-source projects &amp; extensions'
        },
        {
            name: 'Blog', url: '/blog/',
            icon: 'fa fa-pen-nib', style: 'background:#ede9fe;color:#7c3aed',
            desc: 'Longer-form notes &amp; write-ups'
        }
    ];

    initialEl.innerHTML = categories.map(c => {
        const count = SITE_SEARCH_DATA.filter(d => d.section === c.name).length;
        const iconStyle = 'width:52px;height:52px;border-radius:14px;font-size:1.2rem' + (c.style ? ';' + c.style : '');
        return (
            '<div class="col-md-4">' +
            '<a href="' + c.url + '" class="search-cat-card">' +
            '<div class="tip-icon ' + (c.cls || '') + ' mx-auto mb-3" style="' + iconStyle + '">' +
            '<i class="' + c.icon + '"></i></div>' +
            '<div style="font-weight:700;color:var(--dark-text);margin-bottom:4px">' + c.name + '</div>' +
            '<div style="font-size:0.82rem;color:var(--muted-text)">' + c.desc + '</div>' +
            '<div class="search-cat-count">' + count + ' items indexed</div>' +
            '</a></div>'
        );
    }).join('');
});
</script>
{% endraw %}
